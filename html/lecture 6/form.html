<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Forms</h1>
    <div>
        <form action="welcomePage.html" target="_blank">


            <fieldset>
                <legend>Enter your Basic information </legend>



                <label for="full name">full name:</label>
                <input type="text" id="full name" placeholder="Enter your name" required>
                <br> <br>
                <label for="email">emaill:</label>
                <input type="email" id="email" placeholder="Enter your email" required>


                <br> <br>
                <label for="password">password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <br> <br>
                <label for="checkbox">Are you 18+?</label>
                <input type="checkbox" id="checkbox" required>

                <br> <br>
                <label for="phone number">Enter you phone number:</label>
                <input type="number" id="number" required sin="0">



                <br> <br>
                <label for="Gender">Gender:</label>
                <label for="male">male</label>
                <input type="radio" id="male" name="Gender">
                <label for="female">female</label>
                <input type="radio" id="female" name="Gender">
                <br> <br>
                <label for="Date">Enter you DOB:</label>
                <input type="date" id="date" required>
                <br> <br>
                <label for="file">upload photo:</label>
                <input type="file" id="file">
                <br> <br>
                <label for="city">selcect you city:</label>
                <select name="" id="city">
                    <option value="delhi">Delhi</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="noida">Noida</option>
                    <option value="kolkata">Kolkata</option>
                    <option value="hariyana">Hariyana</option>
                    <option value="jaipur">Jaipur</option>
                </select>
                <br> <br>
                <button type="submit"> submit form</button>

            </fieldset>

        </form>


    </div>
</body>

</html>
